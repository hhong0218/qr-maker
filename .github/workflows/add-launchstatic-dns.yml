name: Add launchstatic DNS (one-time)

on:
  workflow_dispatch:

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure CNAME launchstatic.matchiq.co.kr
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: 34dbddbeffd17269f87196b4fa470465
        run: |
          set -e
          TARGET="launchstatic.pages.dev"
          EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=launchstatic.matchiq.co.kr" \
            -H "Authorization: Bearer $CF_TOKEN")
          echo "$EXISTING"
          ID=$(echo "$EXISTING" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'] if d.get('result') else '')" 2>/dev/null || true)
          if [ -n "$ID" ]; then
            curl -s -X PUT "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$ID" \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data "{\"type\":\"CNAME\",\"name\":\"launchstatic\",\"content\":\"$TARGET\",\"proxied\":true,\"ttl\":1}"
          else
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" \
              --data "{\"type\":\"CNAME\",\"name\":\"launchstatic\",\"content\":\"$TARGET\",\"proxied\":true,\"ttl\":1}"
          fi